<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<link rel="manifest" href="manifest.json">
<title>UTR CAM</title>
<style>
:root{--accent:#65e6ff;--bg:#070a10;--glass:rgba(14,19,29,.66);--line:rgba(255,255,255,.14);--text:#f5f7ff;--muted:#a5b0c3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#173b55 0,transparent 38%),radial-gradient(circle at 100% 100%,#28133f 0,transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{padding-bottom:88px}.app{max-width:650px;margin:auto;padding:12px}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 12px 42px #0009;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px}
header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;margin-bottom:10px}h1{font-size:20px;margin:0}.status{font-size:11px;color:var(--muted)}
.camera{position:relative;overflow:hidden;aspect-ratio:9/16;background:#020305;border-radius:28px}.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0007,transparent 22%,transparent 63%,#000c)}
.topbar{position:absolute;z-index:2;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.badge{padding:8px 10px;border-radius:15px;background:#0008;border:1px solid #fff2;font-size:11px;backdrop-filter:blur(12px)}
.wm{position:absolute;z-index:2;left:12px;right:12px;bottom:92px;padding:10px 12px;border-radius:17px;background:#05080dd9;border:1px solid #ffffff18;font-size:11px;line-height:1.45;pointer-events:none}.wm b{color:var(--accent)}
.controls{position:absolute;z-index:3;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:center;gap:12px}.btn{border:1px solid #fff2;background:#ffffff13;color:white;width:52px;height:52px;border-radius:50%;font-size:20px;backdrop-filter:blur(12px)}.capture{width:76px;height:76px;border:5px solid #fff;background:var(--accent);color:#071018;font-size:25px}
.panel{padding:14px;margin-top:10px}.panel h2{font-size:13px;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:11px;border-radius:17px;background:#ffffff09;border:1px solid #fff1}.stat b{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.stat span{font-size:12px;word-break:break-word}
.guide{display:flex;gap:8px;margin-top:9px}.guide input{min-width:0;flex:1;padding:12px;border-radius:15px;border:1px solid #fff2;background:#ffffff0b;color:#fff;outline:none}.guide button{padding:12px 14px;border:1px solid #fff2;background:#ffffff10;color:#fff;border-radius:15px}
nav{position:fixed;z-index:8;bottom:9px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-radius:22px}.nav{background:none;border:0;color:var(--muted);font-size:10px;padding:7px}.nav.active{color:var(--accent)}.nav div{font-size:18px;margin-bottom:2px}
#message{position:fixed;z-index:20;top:14px;left:50%;transform:translateX(-50%);padding:10px 14px;display:none;font-size:12px;white-space:nowrap}.modal{position:fixed;inset:0;z-index:15;display:none;place-items:end center;background:#0008}.sheet{width:min(650px,100%);padding:18px;border-radius:26px 26px 0 0}.sheet input{width:100%;padding:13px;border-radius:15px;border:1px solid #fff2;background:#ffffff0d;color:#fff}.sheet button{width:100%;padding:13px;margin-top:8px;border:1px solid #fff2;background:#ffffff0d;color:#fff;border-radius:15px}
.map{position:relative;height:110px;margin-top:10px;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#14202a,#0a1018);border:1px solid #fff1}.map:before,.map:after{content:"";position:absolute;background:#ffffff12;transform:rotate(25deg)}.map:before{width:140%;height:2px;top:52px;left:-20%}.map:after{width:2px;height:140%;left:52%;top:-20%}.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px}
</style>
</head>
<body>
<div id="message" class="glass"></div>
<main class="app">
<header class="glass"><div><h1>UTR CAM</h1><div class="status">Evidencia inteligente · V0.4</div></div><div id="camState" class="status">Cámara...</div></header>
<section class="camera glass">
<video id="video" autoplay playsinline muted></video><div class="overlay"></div>
<div class="topbar"><span class="badge">📷 <span id="lens">TRASERA</span></span><span class="badge">📍 <span id="gpsShort">GPS...</span></span></div>
<div class="wm"><b>UTR CAM</b> · <span id="wmDate">--</span><br>📍 <span id="wmCoords">Ubicación pendiente</span> · 🧾 <span id="wmGuide">GUÍA PENDIENTE</span></div>
<div class="controls"><button class="btn" id="torch">⚡</button><button class="btn" id="flip">↻</button><button class="btn capture" id="capture">●</button><button class="btn" id="loc">⌖</button></div>
</section>

<section class="panel glass">
<h2>Datos de evidencia</h2>
<div class="grid"><div class="stat"><b>GUÍA</b><span id="guide">PENDIENTE</span></div><div class="stat"><b>GPS</b><span id="coords">Pendiente</span></div><div class="stat"><b>FECHA / HORA</b><span id="date">--</span></div><div class="stat"><b>ESTADO</b><span id="saved">Sin captura</span></div></div>
<div class="guide"><input id="guideInput" placeholder="Escribe o pega la guía"><button id="guideBtn">OK</button></div>
<div class="map"><div class="pin">📍</div></div>
</section>
</main>

<nav class="glass"><button class="nav active"><div>📷</div>Cámara</button><button class="nav" onclick="msg('Paquetes: siguiente módulo')"><div>📦</div>Paquetes</button><button class="nav" onclick="msg('Mapa: siguiente módulo')"><div>🗺️</div>Mapa</button><button class="nav" onclick="openPersonalize()"><div>🎨</div>Personalizar</button></nav>

<div id="modal" class="modal" onclick="if(event.target===this)closePersonalize()"><div class="sheet glass"><h3>🎨 Personalizar UTR CAM</h3><input id="accentInput" placeholder="#65e6ff" maxlength="7"><button onclick="saveAccent()">Aplicar color</button><button onclick="closePersonalize()">Cerrar</button></div></div>

<script>
const $=id=>document.getElementById(id);let stream=null,facing='environment',pos=null,guide='PENDIENTE';
function msg(t){const e=$('message');e.textContent=t;e.style.display='block';clearTimeout(window._m);window._m=setTimeout(()=>e.style.display='none',2300)}
function fmtDate(){return new Date().toLocaleString('es-MX',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function updateUI(){const d=fmtDate();$('wmDate').textContent=d;$('date').textContent=d;$('wmGuide').textContent=guide;const c=pos?`${pos.latitude.toFixed(6)}, ${pos.longitude.toFixed(6)}`:'Ubicación pendiente';$('wmCoords').textContent=c;$('coords').textContent=c;$('gpsShort').textContent=pos?`${pos.latitude.toFixed(4)},${pos.longitude.toFixed(4)}`:'GPS...'}
async function startCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30}},audio:false});$('video').srcObject=stream;$('camState').textContent=facing==='environment'?'Cámara trasera':'Cámara frontal';$('lens').textContent=facing==='environment'?'TRASERA':'FRONTAL';cameraFeatures()}catch(e){msg('Permite el acceso a la cámara')}}
async function cameraFeatures(){const t=stream?.getVideoTracks?.()[0];if(!t)return;try{const caps=t.getCapabilities?.();if(caps?.focusMode?.includes('continuous'))await t.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}}
async function toggleTorch(){const t=stream?.getVideoTracks?.()[0];if(!t)return;const caps=t.getCapabilities?.();if(!caps?.torch)return msg('Linterna no disponible');try{const on=!(t.getSettings().torch);await t.applyConstraints({advanced:[{torch:on}]});msg(on?'Linterna encendida':'Linterna apagada')}catch(e){msg('No se pudo controlar la linterna')}}
function gps(){if(!navigator.geolocation)return msg('GPS no disponible');navigator.geolocation.getCurrentPosition(p=>{pos=p.coords;updateUI();msg('GPS actualizado ✓')},()=>msg('Activa el permiso de ubicación'),{enableHighAccuracy:true,timeout:15000,maximumAge:3000})}
function setGuide(){const v=$('guideInput').value.trim();if(!v)return msg('Escribe una guía');guide=v.toUpperCase();$('guide').textContent=guide;updateUI();localStorage.setItem('utr-guide',guide);msg('Guía guardada ✓')}
function capture(){const v=$('video');if(!v.videoWidth)return msg('La cámara aún no está lista');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);const s=Math.max(1,c.width/1080),h=Math.round(170*s);x.fillStyle='rgba(5,8,13,.86)';x.fillRect(0,c.height-h,c.width,h);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent');x.font=`${Math.round(30*s)}px system-ui`;x.fillText('UTR CAM',Math.round(28*s),c.height-Math.round(122*s));x.fillStyle='#fff';x.font=`${Math.round(18*s)}px system-ui`;x.fillText(fmtDate(),Math.round(28*s),c.height-Math.round(87*s));x.fillText(`GPS ${pos?`${pos.latitude.toFixed(6)}, ${pos.longitude.toFixed(6)}`:'NO DISPONIBLE'}`,Math.round(28*s),c.height-Math.round(55*s));x.fillText(`GUIA ${guide}`,Math.round(28*s),c.height-Math.round(23*s));const data=c.toDataURL('image/jpeg',.94);sessionStorage.setItem('utr-last-evidence',data);localStorage.setItem('utr-last-meta',JSON.stringify({guide,coords:pos?`${pos.latitude},${pos.longitude}`:null,date:fmtDate()}));$('saved').textContent='Evidencia guardada';msg('Evidencia lista ✓')}
function openPersonalize(){$('accentInput').value=localStorage.getItem('utr-accent')||'#65e6ff';$('modal').style.display='grid'}function closePersonalize(){$('modal').style.display='none'}function saveAccent(){const c=$('accentInput').value.trim();if(!/^#[0-9a-f]{6}$/i.test(c))return msg('Usa un HEX como #65e6ff');document.documentElement.style.setProperty('--accent',c);localStorage.setItem('utr-accent',c);closePersonalize();msg('Color guardado ✓')}
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};$('torch').onclick=toggleTorch;$('loc').onclick=gps;$('capture').onclick=capture;$('guideBtn').onclick=setGuide;$('guideInput').addEventListener('keydown',e=>{if(e.key==='Enter')setGuide()});
const saved=localStorage.getItem('utr-accent');if(saved)document.documentElement.style.setProperty('--accent',saved);const sg=localStorage.getItem('utr-guide');if(sg){guide=sg;$('guide').textContent=guide;$('guideInput').value=guide}setInterval(updateUI,1000);updateUI();startCam();gps();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?ver=4').catch(()=>{});
</script>
</body>
</html>
