<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>UTR CAM</title>
<style>
:root{--accent:#65e6ff;--bg:#080b12;--glass:rgba(18,23,34,.62);--line:rgba(255,255,255,.13);--text:#f5f7ff;--muted:#9ba7bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#18334b 0,transparent 38%),radial-gradient(circle at 100% 100%,#24133d 0,transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:620px;margin:auto;padding:16px 14px 92px}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 12px 40px #0008;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px}h1{font-size:20px;margin:0}.status{font-size:11px;color:var(--muted)}
.camera{position:relative;overflow:hidden;aspect-ratio:9/16;background:#020306;border-radius:28px}.camera video{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0007,transparent 25%,transparent 65%,#0009)}
.info{position:absolute;left:12px;right:12px;bottom:12px;padding:12px;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:14px;background:#0007;border:1px solid #fff2}.controls{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:center;gap:16px}.btn{border:1px solid #fff2;background:#ffffff12;color:white;width:54px;height:54px;border-radius:50%;font-size:20px;backdrop-filter:blur(12px)}.capture{width:72px;height:72px;border:5px solid #fff;background:var(--accent);color:#081018;font-size:24px}
.panel{padding:15px;margin-top:12px}.panel h2{font-size:14px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;border-radius:17px;background:#ffffff09;border:1px solid #fff1}.stat b{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.stat span{font-size:13px}
nav{position:fixed;z-index:5;bottom:10px;left:50%;transform:translateX(-50%);width:min(590px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border-radius:22px}.nav{background:none;border:0;color:var(--muted);font-size:11px;padding:8px}.nav.active{color:var(--accent)}.nav div{font-size:19px;margin-bottom:2px}
#message{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:10;padding:11px 15px;display:none;font-size:12px}
@media(max-width:380px){.app{padding-left:9px;padding-right:9px}}
</style>
</head>
<body>
<div id="message" class="glass"></div>
<main class="app">
<header class="glass"><div><h1>UTR CAM</h1><div class="status">Evidencia inteligente de entrega</div></div><div id="camState" class="status">Cámara...</div></header>
<section class="camera glass">
<video id="video" autoplay playsinline muted></video><div class="overlay"></div>
<div class="info glass"><div class="row"><span class="pill">📍 <span id="gps">GPS buscando...</span></span><span class="pill">🕐 <span id="clock">--:--</span></span></div></div>
<div class="controls"><button class="btn" id="flip" title="Cambiar cámara">↻</button><button class="btn capture" id="capture" title="Tomar evidencia">●</button><button class="btn" id="loc" title="Actualizar GPS">⌖</button></div>
</section>
<section class="panel glass"><h2>Última evidencia</h2><div class="grid"><div class="stat"><b>GUÍA</b><span id="guide">Pendiente</span></div><div class="stat"><b>UBICACIÓN</b><span id="coords">Pendiente</span></div><div class="stat"><b>FECHA / HORA</b><span id="date">--</span></div><div class="stat"><b>ESTADO</b><span id="saved">Sin captura</span></div></div></section>
</main>
<nav class="glass"><button class="nav active"><div>📷</div>Cámara</button><button class="nav" onclick="msg('Módulo de paquetes: siguiente fase')"><div>📦</div>Paquetes</button><button class="nav" onclick="msg('Mapa: preparado para la siguiente fase')"><div>🗺️</div>Mapa</button><button class="nav" onclick="personalize()"><div>🎨</div>Personalizar</button></nav>
<script>
const $=id=>document.getElementById(id);let stream=null,facing='environment',pos=null;
function msg(t){let e=$('message');e.textContent=t;e.style.display='block';clearTimeout(window._m);window._m=setTimeout(()=>e.style.display='none',2200)}
async function startCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;$('camState').textContent=facing==='environment'?'Cámara trasera':'Cámara frontal'}catch(e){$('camState').textContent='Sin cámara';msg('Permite el acceso a la cámara')}}
function gps(){if(!navigator.geolocation){$('gps').textContent='No disponible';return}navigator.geolocation.getCurrentPosition(p=>{pos=p.coords;$('gps').textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;$('coords').textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`},()=>{$('gps').textContent='Permiso pendiente'},{enableHighAccuracy:true,timeout:15000,maximumAge:5000})}
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};
$('loc').onclick=gps;
$('capture').onclick=()=>{if(!$('video').videoWidth){msg('La cámara aún no está lista');return}const c=document.createElement('canvas');c.width=$('video').videoWidth;c.height=$('video').videoHeight;c.getContext('2d').drawImage($('video'),0,0);const data=c.toDataURL('image/jpeg',.9);sessionStorage.setItem('utr-last-evidence',data);const d=new Date();$('date').textContent=d.toLocaleString('es-MX');$('saved').textContent='Captura guardada';msg('Evidencia capturada ✓')};
function tick(){$('clock').textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}setInterval(tick,1000);tick();
function personalize(){const c=prompt('Color de acento (ej. #65e6ff):',localStorage.getItem('utr-accent')||'#65e6ff');if(c&&/^#[0-9a-f]{6}$/i.test(c)){document.documentElement.style.setProperty('--accent',c);localStorage.setItem('utr-accent',c);msg('Personalización guardada ✓')}}
const saved=localStorage.getItem('utr-accent');if(saved)document.documentElement.style.setProperty('--accent',saved);
startCam();gps();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
