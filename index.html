<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>UTR CAM</title>
<style>
:root{--accent:#65e6ff;--bg:#070a10;--glass:rgba(14,19,29,.68);--line:rgba(255,255,255,.14);--text:#f5f7ff;--muted:#a5b0c3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#173b55 0,transparent 38%),radial-gradient(circle at 100% 100%,#28133f 0,transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{padding-bottom:88px}.app{max-width:650px;margin:auto;padding:12px}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 12px 42px #0009;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px}
header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;margin-bottom:10px}h1{font-size:20px;margin:0}.status{font-size:11px;color:var(--muted)}
.camera{position:relative;overflow:hidden;aspect-ratio:9/16;background:#020305;border-radius:28px}.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0007,transparent 22%,transparent 63%,#000c)}
.topbar{position:absolute;z-index:2;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.badge{padding:8px 10px;border-radius:15px;background:#0008;border:1px solid #fff2;font-size:11px;backdrop-filter:blur(12px)}
.wm{position:absolute;z-index:2;left:12px;right:12px;bottom:92px;padding:10px 12px;border-radius:17px;background:#05080dd9;border:1px solid #ffffff18;font-size:11px;line-height:1.45;pointer-events:none}.wm b{color:var(--accent)}
.controls{position:absolute;z-index:3;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:center;gap:10px}.btn{border:1px solid #fff2;background:#ffffff13;color:white;width:50px;height:50px;border-radius:50%;font-size:19px;backdrop-filter:blur(12px)}.capture{width:76px;height:76px;border:5px solid #fff;background:var(--accent);color:#071018;font-size:25px}
.panel{padding:14px;margin-top:10px}.panel h2{font-size:13px;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:11px;border-radius:17px;background:#ffffff09;border:1px solid #fff1}.stat b{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.stat span{font-size:12px;word-break:break-word}
.guide{display:flex;gap:7px;margin-top:9px}.guide input{min-width:0;flex:1;padding:12px;border-radius:15px;border:1px solid #fff2;background:#ffffff0b;color:#fff;outline:none}.guide button{padding:12px 12px;border:1px solid #fff2;background:#ffffff10;color:#fff;border-radius:15px}.scan{margin-top:8px;width:100%;padding:12px;border:1px solid #fff2;background:linear-gradient(90deg,#ffffff10,#ffffff06);color:#fff;border-radius:15px}
#map{height:145px;margin-top:10px;border-radius:19px;overflow:hidden;border:1px solid #fff2;background:#111}.leaflet-control-attribution{font-size:7px}
#message{position:fixed;z-index:30;top:14px;left:50%;transform:translateX(-50%);padding:10px 14px;display:none;font-size:12px;white-space:nowrap}.modal{position:fixed;inset:0;z-index:25;display:none;place-items:end center;background:#0008}.sheet{width:min(650px,100%);padding:18px;border-radius:26px 26px 0 0}.sheet input{width:100%;padding:13px;border-radius:15px;border:1px solid #fff2;background:#ffffff0d;color:#fff}.sheet button{width:100%;padding:13px;margin-top:8px;border:1px solid #fff2;background:#ffffff0d;color:#fff;border-radius:15px}
#ocrStatus{font-size:11px;color:var(--muted);margin-top:7px;display:none}.scanOverlay{position:absolute;inset:0;z-index:12;display:none;background:rgba(0,0,0,.62)}.scanTop{position:absolute;top:18px;left:16px;right:16px;display:flex;justify-content:space-between;padding:11px 13px;border-radius:15px;background:#05080dcc;border:1px solid #fff2;font-size:12px}.scanTop span{cursor:pointer;font-size:17px}.scanFrame{position:absolute;left:10%;right:10%;top:31%;height:28%;border:2px solid var(--accent);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.28),0 0 25px #0008}.scanLine{position:absolute;left:5%;right:5%;top:10%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scanMove 1.7s ease-in-out infinite}.scanHint{position:absolute;left:20px;right:20px;bottom:22%;text-align:center;font-size:12px;color:#fff}@keyframes scanMove{0%,100%{top:10%}50%{top:88%}}.mapModal{position:fixed;inset:0;z-index:40;display:none;background:#070a10}.mapHead{position:absolute;z-index:2;top:12px;left:12px;right:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.mapHead button{border:1px solid #fff2;background:#ffffff10;color:#fff;border-radius:14px;padding:9px 12px}#bigMap{position:absolute;inset:0}
nav{position:fixed;z-index:8;bottom:9px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-radius:22px}
.nav{background:none!important;border:0!important;color:var(--muted)!important;font-size:10px!important;padding:7px!important;border-radius:15px!important}
.nav.active{color:var(--accent)!important}
.nav div{font-size:18px;margin-bottom:2px}

</style>
</head>
<body>
<div id="message" class="glass"></div>
<main class="app">
<header class="glass"><div><h1>UTR CAM</h1><div class="status">Evidencia inteligente · V0.7.2</div></div><div id="camState" class="status">Cámara...</div></header>
<section class="camera glass">
<video id="video" autoplay playsinline muted></video><div class="overlay"></div>
<div class="topbar"><span class="badge">📷 <span id="lens">TRASERA</span></span><span class="badge">📍 <span id="gpsShort">GPS...</span></span></div>
<div class="wm"><b>UTR CAM</b> · <span id="wmDate">--</span><br>📍 <span id="wmCoords">Ubicación pendiente</span> · 🧾 <span id="wmGuide">GUÍA PENDIENTE</span></div>
<div class="controls"><button class="btn" id="torch">⚡</button><button class="btn" id="flip">↻</button><button class="btn capture" id="capture">●</button><button class="btn" id="loc">⌖</button></div>
</section>
<section class="panel glass">
<h2>Datos de evidencia</h2>
<div class="grid"><div class="stat"><b>GUÍA</b><span id="guide">PENDIENTE</span></div><div class="stat"><b>GPS</b><span id="coords">Pendiente</span></div><div class="stat"><b>FECHA / HORA</b><span id="date">--</span></div><div class="stat"><b>ESTADO</b><span id="saved">Sin captura</span></div></div>
<div class="guide"><input id="guideInput" placeholder="Escribe o pega la guía"><button id="guideBtn">OK</button></div>
<button class="scan" id="scanBtn">🔎 Escanear guía</button>
<div id="ocrStatus">OCR: listo</div>
<div id="map"></div><button class="scan" id="mapBtn">🗺️ Abrir mapa grande</button>
</section>
</main>
<nav class="glass"><button class="nav active"><div>📷</div>Cámara</button><button class="nav" onclick="msg('Paquetes: siguiente módulo')"><div>📦</div>Paquetes</button><button class="nav" onclick="scrollMap()"><div>🗺️</div>Mapa</button><button class="nav" onclick="openPersonalize()"><div>🎨</div>Personalizar</button></nav>
<div id="mapModal" class="mapModal"><div class="mapHead glass"><b>🗺️ Mapa de evidencia</b><button onclick="closeBigMap()">← Volver</button></div><div id="bigMap"></div></div><div id="modal" class="modal" onclick="if(event.target===this)closePersonalize()"><div class="sheet glass"><h3>🎨 Personalizar UTR CAM</h3><input id="accentInput" placeholder="#65e6ff" maxlength="7"><button onclick="saveAccent()">Aplicar color</button><button onclick="closePersonalize()">Cerrar</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);let stream=null,facing='environment',pos=null,guide='PENDIENTE',map=null,marker=null;
function msg(t){const e=$('message');e.textContent=t;e.style.display='block';clearTimeout(window._m);window._m=setTimeout(()=>e.style.display='none',2400)}
function fmtDate(){return new Date().toLocaleString('es-MX',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function updateUI(){const d=fmtDate();$('wmDate').textContent=d;$('date').textContent=d;$('wmGuide').textContent=guide;const c=pos?`${pos.latitude.toFixed(6)}, ${pos.longitude.toFixed(6)}`:'Ubicación pendiente';$('wmCoords').textContent=c;$('coords').textContent=c;$('gpsShort').textContent=pos?`${pos.latitude.toFixed(4)},${pos.longitude.toFixed(4)}`:'GPS...'}
async function startCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30}},audio:false});$('video').srcObject=stream;$('camState').textContent=facing==='environment'?'Cámara trasera':'Cámara frontal';$('lens').textContent=facing==='environment'?'TRASERA':'FRONTAL';cameraFeatures()}catch(e){msg('Permite el acceso a la cámara')}}
async function cameraFeatures(){const t=stream?.getVideoTracks?.()[0];if(!t)return;try{const caps=t.getCapabilities?.();if(caps?.focusMode?.includes('continuous'))await t.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}}
async function toggleTorch(){const t=stream?.getVideoTracks?.()[0];if(!t)return;const caps=t.getCapabilities?.();if(!caps?.torch)return msg('Linterna no disponible');try{const on=!(t.getSettings().torch);await t.applyConstraints({advanced:[{torch:on}]});msg(on?'Linterna encendida':'Linterna apagada')}catch(e){msg('No se pudo controlar la linterna')}}
function gps(){if(!navigator.geolocation)return msg('GPS no disponible');navigator.geolocation.getCurrentPosition(p=>{pos=p.coords;updateUI();updateMap();msg('GPS actualizado ✓')},()=>msg('Activa el permiso de ubicación'),{enableHighAccuracy:true,timeout:15000,maximumAge:3000})}
function setGuide(){const v=$('guideInput').value.trim();if(!v)return msg('Escribe una guía');guide=v.toUpperCase();$('guide').textContent=guide;updateUI();localStorage.setItem('utr-guide',guide);msg('Guía guardada ✓')}
function initMap(){
 try{
  if(!window.L){$('map').innerHTML='<div style="padding:18px;color:#a5b0c3;font-size:12px">🗺️ Mapa disponible cuando haya conexión.</div>';return}
  map=L.map('map',{zoomControl:false,attributionControl:true}).setView([19.291636,-98.953781],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true,attribution:'© OpenStreetMap'}).addTo(map);
  marker=L.marker([19.291636,-98.953781]).addTo(map).bindPopup('Ubicación de evidencia');
  updateMap();
 }catch(e){
  $('map').innerHTML='<div style="padding:18px;color:#a5b0c3;font-size:12px">🗺️ Mapa temporalmente no disponible.</div>';
 }
}
function updateMap(){if(!map||!pos)return;const ll=[pos.latitude,pos.longitude];marker.setLatLng(ll);map.setView(ll,17,{animate:true})}
function closeBigMap(){$('mapModal').style.display='none'}
function scrollMap(){document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'});if(map)setTimeout(()=>map.invalidateSize(),350)}
function openMapLarge(){
 if(!pos)return msg('Primero obtén el GPS');
 if(!window.L)return msg('Mapa no disponible sin conexión');
 $('mapModal').style.display='block';
 setTimeout(()=>{
  try{
   if(!window.bigMap){
    window.bigMap=L.map('bigMap').setView([pos.latitude,pos.longitude],18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(window.bigMap);
    window.bigMarker=L.marker([pos.latitude,pos.longitude]).addTo(window.bigMap);
   }else{
    window.bigMap.setView([pos.latitude,pos.longitude],18);
    window.bigMarker.setLatLng([pos.latitude,pos.longitude]);
   }
   window.bigMap.invalidateSize();
  }catch(e){closeBigMap();msg('No se pudo abrir el mapa')}
 },100);
}
function capture(){const v=$('video');if(!v.videoWidth)return msg('La cámara aún no está lista');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);const s=Math.max(1,c.width/1080),h=Math.round(205*s);x.fillStyle='rgba(5,8,13,.88)';x.fillRect(0,c.height-h,c.width,h);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent');x.font=`${Math.round(30*s)}px system-ui`;x.fillText('UTR CAM',Math.round(28*s),c.height-Math.round(151*s));x.fillStyle='#fff';x.font=`${Math.round(18*s)}px system-ui`;x.fillText(fmtDate(),Math.round(28*s),c.height-Math.round(116*s));x.fillText(`GPS ${pos?`${pos.latitude.toFixed(6)}, ${pos.longitude.toFixed(6)}`:'NO DISPONIBLE'}`,Math.round(28*s),c.height-Math.round(82*s));x.fillText(`GUIA ${guide}`,Math.round(28*s),c.height-Math.round(49*s));x.fillText('MAPA 📍 disponible en la ficha de evidencia',Math.round(28*s),c.height-Math.round(16*s));const data=c.toDataURL('image/jpeg',.94);sessionStorage.setItem('utr-last-evidence',data);localStorage.setItem('utr-last-meta',JSON.stringify({guide,coords:pos?`${pos.latitude},${pos.longitude}`:null,date:fmtDate()}));$('saved').textContent='Evidencia guardada';msg('Evidencia lista ✓')}
async function scanGuide(){
 if(!stream)return msg('Cámara no lista');
 if(!window.Tesseract)return msg('OCR no disponible sin conexión');
 $('scanOverlay').style.display='block';$('ocrStatus').style.display='block';$('ocrStatus').textContent='OCR: apunta la guía al recuadro...';
 await new Promise(r=>setTimeout(r,900));
 try{
  const v=$('video'),full=document.createElement('canvas'),maxW=1800;
  full.width=Math.min(v.videoWidth||1280,maxW);full.height=Math.round((v.videoHeight||720)*(full.width/(v.videoWidth||1280)));
  full.getContext('2d').drawImage(v,0,0,full.width,full.height);
  const crop=document.createElement('canvas');crop.width=Math.round(full.width*.82);crop.height=Math.round(full.height*.28);
  const sx=Math.round(full.width*.09),sy=Math.round(full.height*.36);crop.getContext('2d').drawImage(full,sx,sy,crop.width,crop.height,0,0,crop.width,crop.height);
  const p=crop.getContext('2d'),img=p.getImageData(0,0,crop.width,crop.height);
  for(let i=0;i<img.data.length;i+=4){const g=.299*img.data[i]+.587*img.data[i+1]+.114*img.data[i+2],v2=Math.max(0,Math.min(255,(g-128)*1.8+128));img.data[i]=img.data[i+1]=img.data[i+2]=v2}p.putImageData(img,0,0);
  $('ocrStatus').textContent='OCR: leyendo...';
  const r=await Tesseract.recognize(crop,'eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent=`OCR: ${Math.round((m.progress||0)*100)}%`}});
  const normalized=r.data.text.toUpperCase().replace(/[^A-Z0-9\s-]/g,' ').replace(/\s+/g,' ').trim();
  const candidates=(normalized.match(/[A-Z0-9]{6,24}/g)||[]).filter(x=>/[A-Z]/.test(x)&&/[0-9]/.test(x)).sort((a,b)=>b.length-a.length);
  $('scanOverlay').style.display='none';
  if(candidates.length){guide=candidates[0];$('guideInput').value=guide;$('guide').textContent=guide;updateUI();localStorage.setItem('utr-guide',guide);$('ocrStatus').textContent='OCR: guía detectada ✓';msg(`Guía detectada: ${guide}`)}else{$('ocrStatus').textContent='OCR: no encontré una guía clara';msg('No se detectó una guía clara')}
 }catch(e){$('scanOverlay').style.display='none';$('ocrStatus').textContent='OCR: error';msg('No se pudo ejecutar OCR')}
}
function openPersonalize(){$('accentInput').value=localStorage.getItem('utr-accent')||'#65e6ff';$('modal').style.display='grid'}function closePersonalize(){$('modal').style.display='none'}function saveAccent(){const c=$('accentInput').value.trim();if(!/^#[0-9a-f]{6}$/i.test(c))return msg('Usa un HEX como #65e6ff');document.documentElement.style.setProperty('--accent',c);localStorage.setItem('utr-accent',c);closePersonalize();msg('Color guardado ✓')}
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};$('torch').onclick=toggleTorch;$('loc').onclick=gps;$('capture').onclick=capture;$('guideBtn').onclick=setGuide;$('guideInput').addEventListener('keydown',e=>{if(e.key==='Enter')setGuide()});$('scanBtn').onclick=scanGuide;$('scanClose').onclick=()=>{$('scanOverlay').style.display='none';$('ocrStatus').textContent='OCR: cancelado'};$('mapBtn').onclick=openMapLarge;
const saved=localStorage.getItem('utr-accent');if(saved)document.documentElement.style.setProperty('--accent',saved);const sg=localStorage.getItem('utr-guide');if(sg){guide=sg;$('guide').textContent=guide;$('guideInput').value=guide}
setInterval(updateUI,1000);updateUI();try{initMap()}catch(e){}startCam();gps();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?ver=7_2').catch(()=>{});
</script>
</body>
</html>
